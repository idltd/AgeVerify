<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Bob — get certified</title>
<style>
  :root {
    --bg: #f4f5f9; --card: #ffffff; --text: #1a1a2e; --muted: #6b7280; --border: #e6e7ec;
    --accent: #b69cff; --accent-dark: #8a68f0; --ok: #16a34a; --err: #dc2626; --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text);
    margin: 0; padding: 3rem 1rem; line-height: 1.5;
  }
  .card {
    max-width: 560px; margin: 0 auto; background: var(--card); border-radius: var(--radius);
    padding: 2.25rem; box-shadow: 0 1px 2px rgba(20,20,40,0.04), 0 8px 24px rgba(20,20,40,0.06);
    border-top: 4px solid var(--accent);
  }
  h1 { font-size: 1.4rem; margin: 0 0 0.4rem; }
  .lede { color: var(--muted); margin-top: 0; }
  #picker { display: flex; gap: 0.6rem; flex-wrap: wrap; margin: 1.25rem 0; }
  button {
    background: var(--accent-dark); color: #fff; border: none; border-radius: 8px;
    padding: 0.65rem 1.2rem; font-size: 0.9rem; font-weight: 600; cursor: pointer;
    transition: opacity 0.15s;
  }
  button:hover { opacity: 0.88; }
  textarea {
    width: 100%; height: 90px; font-family: ui-monospace, monospace; font-size: 0.8rem;
    margin-top: 1rem; border: 1px solid var(--border); border-radius: 8px; padding: 0.6rem;
  }
  .err { color: var(--err); font-weight: 600; }
  .ok { color: var(--ok); font-weight: 600; }
</style>
</head>
<body>
<div class="card">
<h1>🔑 You're on Acme Corp's staff portal</h1>
<p class="lede">Because you're here — already authenticated by Acme Corp — you can get a short-lived entitlement certification to use elsewhere.</p>
<div id="picker"></div>
<div id="result"></div>
</div>

<script>
async function init() {
  const picker = document.getElementById('picker');
  const res = await fetch('/api/scope');
  const { scope } = await res.json();
  if (!scope) { picker.innerHTML = '<span class="err">This Voucher is not yet accredited.</span>'; return; }
  picker.innerHTML = scope.map(e => `<button data-entitlement="${e}">Get certified: ${e}</button>`).join('');
  picker.querySelectorAll('button').forEach(btn => btn.onclick = () => certify(btn.dataset.entitlement));
}

async function certify(entitlement) {
  const out = document.getElementById('result');
  out.innerHTML = 'Requesting...';
  try {
    // Acme Corp signs a short-lived assertion locally — no call to root authority yet.
    const authRes = await fetch('/api/authorize', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ entitlement })
    });
    const authData = await authRes.json();
    if (!authRes.ok) { out.innerHTML = `<span class="err">${authData.error}</span>`; return; }

    // Bob's browser carries that assertion to root authority itself for the actual token.
    const mintRes = await fetch('http://localhost:4000/api/mint', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ assertion: authData.assertion })
    });
    const mintData = await mintRes.json();
    if (!mintRes.ok) { out.innerHTML = `<span class="err">${mintData.error}</span>`; return; }

    out.innerHTML = `
      <p class="ok">Certified — ${entitlement}. Valid for ${Math.round(mintData.expiresIn / 60)} minutes.</p>
      <textarea readonly>${mintData.token}</textarea>
      <p>Copy this and paste it at <a href="http://localhost:4002" target="_blank">the Bouncer demo site</a>.</p>
    `;
  } catch (e) {
    out.innerHTML = '<span class="err">Could not reach root authority — is it running on :4000?</span>';
  }
}

init();
</script>
</body>
</html>
